name: Build judgment data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 6"   # every Sunday 02:47 IST
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - run: python pipeline/build_index.py out
      - name: Publish to release data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Judgment data" --notes "Search data for the app (auto-built weekly)." --latest=false
          gh release upload data-latest out/* --clobber
          # remove assets that are no longer produced
          gh release view data-latest --json assets --jq '.assets[].name' | while read -r a; do
            [ -f "out/$a" ] || gh release delete-asset data-latest "$a" -y
          done
