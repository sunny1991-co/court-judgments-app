plugins { id "com.android.application" }

android {
    namespace "in.courtjudgments.app"
    compileSdk 34
    defaultConfig {
        applicationId "in.courtjudgments.app"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    signingConfigs {
        // Personal app, public repo: a fixed key so new builds install as UPDATES
        // over the old one (a new debug key every build would not).
        release {
            storeFile file("release.jks")
            storePassword "courtjudgments"
            keyAlias "court"
            keyPassword "courtjudgments"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
