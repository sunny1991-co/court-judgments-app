<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Court Judgments</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">⚖️</span><div><b>Court Judgments</b><small>Supreme Court · 25 High Courts</small></div></div>
</header>
<nav class="tabs" role="tablist">
  <a href="#sc" data-tab="sc">🏛️ Supreme Court</a>
  <a href="#hc" data-tab="hc">⚖️ High Court</a>
  <a href="#saved" data-tab="saved">⭐ Saved</a>
</nav>

<main id="view"></main>

<template id="tpl-sc">
  <section class="panel">
    <input id="q" class="search" type="search" placeholder="Party naam, case number, vishay ya judge…" autocomplete="off">
    <div class="row">
      <select id="from" aria-label="Se saal"></select>
      <select id="to" aria-label="Tak saal"></select>
      <button id="go" class="btn primary">🔍 Dhoondho</button>
    </div>
    <p class="hint" id="status">Supreme Court ke ~35,000 judgments (1950 se). Pehli baar data download hoga, phir phone mein rahega.</p>
  </section>
  <div id="results"></div>
</template>

<template id="tpl-hc">
  <section class="panel">
    <select id="court" aria-label="High Court"></select>
    <select id="year" aria-label="Saal"></select>
    <input id="q" class="search" type="search" placeholder="Party naam, case number, vishay ya judge…" autocomplete="off">
    <button id="go" class="btn primary wide">🔍 Dhoondho</button>
    <p class="hint" id="status">Court aur saal chuno. Us saal ki list download hogi, phir uske andar search.</p>
  </section>
  <div id="results"></div>
</template>

<template id="tpl-saved">
  <section class="panel"><p class="hint" id="status"></p></section>
  <div id="results"></div>
</template>

<footer class="foot">
  Data: public open datasets (CC-BY-4.0) by Pradeep Vanga / Dattam Labs, from court websites.
  Ye official court app nahi hai — zaroori kaam ke liye court ki website se milaan karein.
  <button id="refresh" class="link">Data refresh karo</button>
</footer>
<script src="app.js"></script>
</body>
</html>
